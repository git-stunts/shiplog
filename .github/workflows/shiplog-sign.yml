name: Shiplog Release Entry

# ROADMAP G9: every release tag is recorded in this repository's own ledger as a
# signed entry in refs/heads/_shiplog/journal/release (policy: release requires
# signatures). The entry is signed with the CI key listed in the trust roster
# (ci@flyingrobots.dev), which can sign entries but cannot approve trust changes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason recorded in the entry"
        required: false
        default: "Manual release entry"

permissions:
  contents: write

concurrency:
  group: shiplog-ledger-release
  cancel-in-progress: false

jobs:
  record-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch the ledger
        run: git fetch --no-tags origin 'refs/heads/_shiplog/*:refs/heads/_shiplog/*'

      - name: Configure Shiplog and SSH signing
        env:
          CI_SSH_PRIVATE_KEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          CI_SSH_PUBLIC_KEY: ${{ vars.CI_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [ -n "${CI_SSH_PRIVATE_KEY:-}" ] || { echo "Missing CI_SSH_PRIVATE_KEY secret" >&2; exit 1; }
          [ -n "${CI_SSH_PUBLIC_KEY:-}" ] || { echo "Missing CI_SSH_PUBLIC_KEY variable" >&2; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$CI_SSH_PRIVATE_KEY" > ~/.ssh/id_shiplog_ci_ed25519
          printf '%s\n' "$CI_SSH_PUBLIC_KEY" > ~/.ssh/id_shiplog_ci_ed25519.pub
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/id_shiplog_ci_ed25519
          git config user.name "Sea Eye"
          git config user.email "ci@flyingrobots.dev"
          git config shiplog.refRoot refs/heads/_shiplog
          echo "SHIPLOG_HOME=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
          SHIPLOG_HOME="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/bin/git-shiplog" trust sync

      - name: Record the signed release entry
        env:
          SHIPLOG_SERVICE: shiplog
          SHIPLOG_STATUS: success
          SHIPLOG_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.reason || format('Release {0}', github.ref_name) }}
          SHIPLOG_TAG: ${{ github.ref_name }}
          SHIPLOG_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHIPLOG_SIGN: "1"
          SHIPLOG_REMOTE: origin
        run: |
          set -euo pipefail
          git shiplog --boring --yes write release
          git shiplog verify release
          local_tip=$(git rev-parse refs/heads/_shiplog/journal/release)
          remote_tip=$(git ls-remote origin refs/heads/_shiplog/journal/release | cut -f1)
          [ "$local_tip" = "$remote_tip" ] || { echo "release entry was not published (local $local_tip, remote ${remote_tip:-none})" >&2; exit 1; }
