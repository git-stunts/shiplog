name: Roadmap Check

# Evaluates every goal's definition of done in ROADMAP.md and updates the
# tracking issue checkboxes. Goal failures are expected while the roadmap is
# open and do not fail the job; only tooling errors (exit 2) do.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test the checker
        run: scripts/roadmap-check.sh --self-test

      - name: Evaluate goals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          scripts/roadmap-check.sh --markdown >> "$GITHUB_STEP_SUMMARY"
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "roadmap-check tooling error" >&2
            exit 2
          fi

      - name: Update tracking issue
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          scripts/roadmap-check.sh --update >/dev/null
          rc=$?
          set -e
          [ "$rc" -ne 2 ] || { echo "roadmap-check update failed" >&2; exit 2; }
