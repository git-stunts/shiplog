name: CI

on:
  push:
    branches: [main, trunk, master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        signing: ["false", "true"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{runner.os}}-buildx-${{matrix.signing}}-${{github.sha}}
          restore-keys: |
            ${{runner.os}}-buildx-${{matrix.signing}}-
            ${{runner.os}}-buildx-

      - name: Build test image (signing=${{matrix.signing}})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shiplog-tests:ci
          build-args: |
            ENABLE_SIGNING=${{ matrix.signing }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move buildx cache (persist across steps)
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run bats in container (mount repo)
        run: |
          docker run --rm -v "$PWD":/workspace shiplog-tests:ci

      - name: Upload test artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-signing-${{ matrix.signing }}
          path: |
            test/**/*.log
            ci-logs/*.log
          if-no-files-found: ignore

  # ROADMAP G2/G3: adversarial trust suite. Runs only test/27_trust_adversarial.bats
  # (selected by its `# bats file_tags=adversarial` marker). Blocking since G3
  # landed the trust verification rewrite (lib/trust-verify.sh).
  adversarial:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Restore Docker layer cache (read-only; tests (false) owns saving it)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: /tmp/.buildx-cache
          key: ${{runner.os}}-buildx-false-${{github.sha}}
          restore-keys: |
            ${{runner.os}}-buildx-false-
            ${{runner.os}}-buildx-

      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: shiplog-tests:ci
          build-args: |
            ENABLE_SIGNING=false
          cache-from: type=local,src=/tmp/.buildx-cache

      - name: Run adversarial trust suite in container (blocking)
        run: |
          docker run --rm \
            -e BATS_FLAGS='--filter-tags adversarial -r' \
            -e TEST_TIMEOUT_SECS=900 \
            -v "$PWD":/workspace shiplog-tests:ci
