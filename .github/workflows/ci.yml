name: CI

on:
  push:
    branches: [main, trunk, master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        signing: ["false", "true"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{runner.os}}-buildx-${{matrix.signing}}-${{github.sha}}
          restore-keys: |
            ${{runner.os}}-buildx-${{matrix.signing}}-
            ${{runner.os}}-buildx-

      - name: Build test image (signing=${{matrix.signing}})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shiplog-tests:ci
          build-args: |
            ENABLE_SIGNING=${{ matrix.signing }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move buildx cache (persist across steps)
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run bats in container (mount repo)
        run: |
          docker run --rm -v "$PWD":/workspace shiplog-tests:ci

      - name: Upload test artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-signing-${{ matrix.signing }}
          path: |
            test/**/*.log
            ci-logs/*.log
          if-no-files-found: ignore

  # ROADMAP G2: adversarial trust suite. Runs only test/27_trust_adversarial.bats
  # (selected by its `# bats file_tags=adversarial` marker). Allowed to fail until
  # G3 lands the trust verification rewrite and flips this job to blocking.
  adversarial:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{runner.os}}-buildx-false-${{github.sha}}
          restore-keys: |
            ${{runner.os}}-buildx-false-
            ${{runner.os}}-buildx-

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shiplog-tests:ci
          build-args: |
            ENABLE_SIGNING=false
          cache-from: type=local,src=/tmp/.buildx-cache

      - name: Run adversarial trust suite in container (allowed to fail)
        run: |
          docker run --rm \
            -e BATS_FLAGS='--filter-tags adversarial -r' \
            -e TEST_TIMEOUT_SECS=900 \
            -v "$PWD":/workspace shiplog-tests:ci
