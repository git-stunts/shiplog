name: CI

on:
  push:
    branches: [main, trunk, master]
  pull_request:

permissions:
  contents: read

jobs:
  # One test image, one suite. Signing coverage (test/06, test/14, test/18)
  # uses SSH keys generated per test, so there is no separate signing build
  # (#135). The suite itself runs with no Bats timeout; this job timeout is
  # the only guard (#132).
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{runner.os}}-buildx-${{github.sha}}
          restore-keys: |
            ${{runner.os}}-buildx-

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shiplog-tests:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move buildx cache (persist across steps)
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run bats in container (mount repo)
        run: |
          docker run --rm -v "$PWD":/workspace shiplog-tests:ci

      - name: Upload test artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test/**/*.log
            ci-logs/*.log
          if-no-files-found: ignore
