name: Lint

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shell:
              - 'bin/git-shiplog'
              - 'contrib/hooks/**'
              - 'scripts/bosun'
              - 'scripts/dev/**'
              - '**/*.sh'
              - '**/*.bash'
            markdown:
              - '**/*.md'
  shellcheck:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Get changed shell files (PRs)
        if: github.event_name == 'pull_request'
        id: changed-shell
        uses: tj-actions/changed-files@v45
        with:
          # Space-separated: a "\n" separator reaches the shell as a backslash
          # plus newline and produced paths like 'foo.sh\'. No tracked path
          # in this repo contains a space.
          separator: " "
          files: |
            bin/git-shiplog
            contrib/hooks/**
            scripts/bosun
            scripts/dev/**
            **/*.sh
            **/*.bash
      - name: Run shellcheck
        run: |
          set -euo pipefail
          echo "ShellCheck version:" && shellcheck --version
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ steps.changed-shell.outputs.any_changed }}" != "true" ]; then
              echo "No changed shell files; skipping."
              exit 0
            fi
            files='${{ steps.changed-shell.outputs.all_changed_files }}'
            read -r -a SH_FILES <<<"$files"
            printf 'Linting %d changed shell files:\n' "${#SH_FILES[@]}"
            printf '  %s\n' "${SH_FILES[@]}"
            shellcheck -S error -s bash "${SH_FILES[@]}"
          else
            # On push (e.g., main), lint every tracked shell file. Files are
            # selected by bash shebang (covers extensionless scripts such as
            # scripts/bosun, #146) plus the extension-based set, deduplicated.
            # Dockerfiles carry bash shebangs inside heredocs and are excluded.
            mapfile -t SH_FILES < <(
              {
                git grep -l -E '^#!.*\bbash\b' -- . ':!docs' ':!*.md' ':!*.bats' ':!Dockerfile' ':!*/Dockerfile'
                git ls-files | grep -E '(^bin/git-shiplog$|^contrib/hooks(/.*)?$|^scripts/bosun$|\.sh$|\.bash$)' || true
              } | sort -u
            )
            if [ "${#SH_FILES[@]}" -eq 0 ]; then
              echo "No shell files found"; exit 0; fi
            printf 'Linting %d shell files:\n' "${#SH_FILES[@]}"
            printf '  %s\n' "${SH_FILES[@]}"
            shellcheck -S error -s bash "${SH_FILES[@]}"
          fi

  markdownlint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.15.0
      - name: Install markdownlint (v0 CLI for targeted lint)
        run: npm install -g markdownlint-cli@0.42.0
      - name: Get changed markdown files (PRs)
        if: github.event_name == 'pull_request'
        id: changed-markdown
        uses: tj-actions/changed-files@v45
        with:
          separator: " "
          files: |
            **/*.md
      - name: Run markdownlint (changed-only on PRs)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ steps.changed-markdown.outputs.any_changed }}" != "true" ]; then
              echo "No changed markdown files; skipping."
              exit 0
            fi
            # Lint only changed Markdown files (avoids baseline noise)
            files='${{ steps.changed-markdown.outputs.all_changed_files }}'
            read -r -a changed <<<"$files"
            printf 'Changed Markdown files: %s\n' "${changed[*]}"
            # Filter out docs/tasks/** except docs/tasks/README.md
            filtered=()
            for f in "${changed[@]}"; do
              case "$f" in
                docs/tasks/README.md) filtered+=("$f") ;;
                docs/tasks/*) ;; # skip JSON-like task files
                *.md) filtered+=("$f") ;;
              esac
            done
            if [ "${#filtered[@]}" -eq 0 ]; then
              echo "No lintable changed Markdown files after filtering; skipping."
              exit 0
            fi
            printf 'Linting files:\n'
            printf '  %s\n' "${filtered[@]}"
            markdownlint "${filtered[@]}"
          else
            # On push (e.g., main), lint the Markdown files changed by the push.
            # ':(glob)**/*.md' matches root-level files too; a plain '**/*.md'
            # pathspec requires a literal '/' and skipped README.md (#146).
            # TODO: switch to full-repo markdownlint-cli2 once baseline is clean
            files=$(git diff --name-only HEAD~1 -- ':(glob)**/*.md' || true)
            if [ -z "$files" ]; then echo "No markdown changes on push."; exit 0; fi
            filtered=()
            while IFS= read -r f; do
              case "$f" in
                docs/tasks/README.md) filtered+=("$f") ;;
                docs/tasks/*) ;;
                *.md) filtered+=("$f") ;;
              esac
            done <<< "$files"
            if [ "${#filtered[@]}" -eq 0 ]; then
              echo "No lintable markdown changes on push."; exit 0; fi
            printf 'Linting files:\n'
            printf '  %s\n' "${filtered[@]}"
            markdownlint "${filtered[@]}"
          fi

  exec_bits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tracked shebang files under scripts/ bin/ contrib/hooks/ must be mode 100755
        run: |
          set -euo pipefail
          bad=0
          while read -r mode _ _ path; do
            [ "$mode" = "100755" ] && continue
            if head -c2 "$path" 2>/dev/null | grep -q '^#!'; then
              echo "::error file=$path::$path has a shebang but mode $mode; run: git update-index --chmod=+x $path"
              bad=1
            fi
          done < <(git ls-files -s -- scripts bin contrib/hooks)
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "All tracked shebang files under scripts/ bin/ contrib/hooks/ are executable."

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint
      - name: Run yamllint
        run: |
          set -euo pipefail
          yamllint -v
          shopt -s globstar nullglob
          files=( .github/workflows/*.yml .github/workflows/*.yaml docs/**/*.yml docs/**/*.yaml )
          if [ ${#files[@]} -gt 0 ]; then
            yamllint -f github "${files[@]}"
          fi

  # Policy JSON against examples/policy.schema.json (#133). Always runs: the
  # inputs are small and a job that only runs when it thinks something
  # changed cannot prove it validates anything. Three assertions:
  #   1. every real policy file and valid fixture is accepted;
  #   2. every invalid fixture is rejected (proves the validator runs);
  #   3. an empty input list is a failure, not a skip.
  policy_schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ajv-cli
        run: npm install -g ajv-cli@5
      - name: Validate policy files against schema
        run: |
          set -euo pipefail
          schema=examples/policy.schema.json
          [ -f "$schema" ] || { echo "::error::missing $schema"; exit 1; }
          shopt -s nullglob
          valid=( examples/policy.json test/fixtures/policy/valid/*.json )
          [ -f .shiplog/policy.json ] && valid+=( .shiplog/policy.json )
          invalid=( test/fixtures/policy/invalid/*.json )
          if [ ${#valid[@]} -eq 0 ]; then
            echo "::error::no policy files to validate (examples/policy.json, test/fixtures/policy/valid/*.json)"
            exit 1
          fi
          if [ ${#invalid[@]} -eq 0 ]; then
            echo "::error::no negative fixtures under test/fixtures/policy/invalid/"
            exit 1
          fi
          failed=0
          echo "Expecting ${#valid[@]} file(s) to validate:"
          for f in "${valid[@]}"; do
            if ajv validate --spec=draft2020 -s "$schema" -d "$f" >/dev/null 2>&1; then
              echo "  ok       $f"
            else
              echo "::error file=$f::$f does not validate against $schema"
              ajv validate --spec=draft2020 -s "$schema" -d "$f" 2>&1 | sed 's/^/    /' || true
              failed=1
            fi
          done
          echo "Expecting ${#invalid[@]} fixture(s) to be rejected:"
          for f in "${invalid[@]}"; do
            if ajv validate --spec=draft2020 -s "$schema" -d "$f" >/dev/null 2>&1; then
              echo "::error file=$f::$f is an invalid fixture but the schema accepted it"
              failed=1
            else
              echo "  rejected $f"
            fi
          done
          exit "$failed"

  # Test-harness hygiene (#132, #148). Cheap text checks that keep the Bats
  # suite honest without running it: unique file numbers, portable shebangs,
  # the Makefile forwarding the documented knobs, one timeout default.
  test_hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test file numbers are unique
        run: |
          set -euo pipefail
          dups=$(ls test/*.bats | sed -E 's|test/([0-9]+)_.*|\1|' | sort | uniq -d || true)
          if [ -n "$dups" ]; then
            echo "::error::duplicate test file numbers: $(echo "$dups" | tr '\n' ' ')"
            ls test/*.bats | grep -E "test/($(echo "$dups" | paste -sd'|' -))_"
            exit 1
          fi
          echo "Test file numbers are unique."
      - name: No hard-coded /bin/bash under test/
        run: |
          set -euo pipefail
          if grep -rn '/bin/bash' test/ | grep -v 'env bash'; then
            echo "::error::use '#!/usr/bin/env bash' (or 'env bash') instead of /bin/bash under test/"
            exit 1
          fi
          echo "No hard-coded /bin/bash under test/."
      - name: Makefile forwards test knobs into the container
        run: |
          set -euo pipefail
          out=$(make -n test TEST_TIMEOUT_SECS=5 SHIPLOG_USE_LOCAL_SANDBOX=1 BATS_FLAGS='-r -T')
          for needle in '-e TEST_TIMEOUT_SECS="5"' '-e SHIPLOG_USE_LOCAL_SANDBOX="1"' '-e BATS_FLAGS="-r -T"'; do
            if ! grep -qF -- "$needle" <<<"$out"; then
              echo "::error::make test does not pass $needle to docker run"
              echo "$out"
              exit 1
            fi
          done
          echo "make test forwards TEST_TIMEOUT_SECS, SHIPLOG_USE_LOCAL_SANDBOX and BATS_FLAGS."
      - name: One timeout default (none) across the runners
        run: |
          set -euo pipefail
          if grep -n 'TEST_TIMEOUT_SECS:-[0-9]' test.sh Dockerfile ci-matrix/Dockerfile; then
            echo "::error::a runner hard-codes a TEST_TIMEOUT_SECS default; the suite runs with no timeout unless the caller opts in"
            exit 1
          fi
          echo "No runner hard-codes a timeout default."
